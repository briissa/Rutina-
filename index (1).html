<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi rutina</title>
<style>
:root{--bg:#fff;color-scheme:light;--card:#fff;--tx:#241f26;--mut:#7a7180;--ac:#c2417a;--ln:#eadfe4;--ac2:#f8e3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 12px}h2{margin:16px 0 0;font-size:20px}h3{margin:0;font-size:16px}
p{margin:6px 0}.mut,small{color:var(--mut)}
#wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dy{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:13px}
.dy span{font-size:10px;color:var(--mut);text-align:center;line-height:1.1;min-height:22px}
.dy.on{background:var(--ac);border-color:var(--ac);color:#fff}.dy.on span{color:#fff}
.dy.td:not(.on){border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-top:10px;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.top i{font-style:normal;color:var(--mut);font-size:12px}
.bd{padding:0 14px 14px;border-top:1px solid var(--ln)}
.ft{background:var(--ac2);border-radius:10px;padding:8px 10px}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
.btn{display:inline-block;border:0;background:var(--ac);color:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;text-decoration:none;white-space:nowrap}
.btn.g{background:var(--ac2);color:var(--ac)}.btn.r{background:transparent;color:#d33;margin-left:auto}
.hs{list-style:none;padding:0;margin:10px 0 0}
.hs li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--ln)}
.hs span{color:var(--mut);flex:1}.hs button{border:0;background:none;color:var(--mut);font-size:14px}
#add{width:100%;margin-top:12px;background:transparent;color:var(--ac);border:1.5px dashed var(--ac)}
#ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:9}
#ov[hidden]{display:none}
.sh{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
.th{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}.ph{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:10px}.top>div{flex:1}.top{justify-content:flex-start}.top i{margin-left:auto}
.nt{margin-top:10px}.nt textarea{min-height:70px;resize:vertical}
footer{margin-top:24px;font-size:12px;color:var(--mut);text-align:center}
</style></head><body><main>
<h1>💪 Mi rutina semanal</h1>
<div id="wk"></div>
<div id="hd"></div>
<div id="ls"></div>
<button class="btn" id="add">+ Agregar ejercicio</button>
<footer>Tus pesos y cambios se guardan en este navegador. Abrí siempre la página desde el mismo lugar.</footer>
</main>
<div id="ov" hidden><div class="sh">
<h3 id="ot"></h3>
<label>Nombre<input id="fn"></label>
<label>Series y repeticiones<input id="fs"></label>
<label>Cómo se hace<textarea id="fh" rows="4"></textarea></label>
<label>Dónde debe sentirse<textarea id="ff" rows="2"></textarea></label>
<label>Foto del ejercicio<input id="fp" type="file" accept="image/*"></label>
<img id="pv" class="ph" alt="" hidden><button class="btn g" id="rp" style="margin-top:8px" hidden>Quitar foto</button>
<label>Link de video de Instagram<input id="fv" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/..."></label>
<div class="row"><button class="btn" id="ok">Guardar</button><button class="btn g" id="no">Cancelar</button><button class="btn r" id="rm">Eliminar</button></div>
</div></div>
<script>
const P='4 × 12-10-8-6';
const SEED=[
{n:'Lunes',s:'Cuádriceps',t:'Piernas (cuádriceps) + abdominales',note:'',ex:[
['Sentadilla smith',P,'Pies al ancho de hombros, espalda recta. Bajá hasta que los muslos queden paralelos al piso y subí empujando con los talones.','Cuádriceps y glúteos.'],
['Sillón de cuádriceps',P,'Sentada, espalda apoyada. Extendé las piernas hasta casi estirar las rodillas y bajá lento, sin soltar el peso.','Frente del muslo.'],
['Aductores sumo',P,'Llevá la pierna hacia adentro contra la resistencia, con movimiento controlado y sin balanceo.','Cara interna del muslo.'],
['Gemelos smith',P,'Subí en puntas de pie, pausa de un segundo arriba y bajá estirando bien.','Pantorrillas.'],
['Elevación de piernas','3 × 15','Acostada, subí las piernas hasta la vertical y bajá lento sin arquear la zona lumbar.','Abdomen bajo.'],
['Abdominales tradicionales','3 × 15','Manos apenas apoyadas en la nuca o cruzadas en el pecho, sin tirar del cuello. Enrollá las costillas hacia la cadera, subiendo lo justo para despegar los omóplatos.','Abdomen (parte frontal).']]},
{n:'Martes',s:'—',t:'Descanso',note:'',ex:[]},
{n:'Miércoles',s:'Espalda',t:'Espalda + bíceps',note:'',ex:[
['Dorsalera toma abierta',P,'Agarre más ancho que los hombros. Tirá la barra hacia el pecho alto llevando los codos hacia abajo y atrás.','Dorsales (costados de la espalda), no los bíceps.'],
['Remo en polea baja',P,'Sentada con la espalda recta. Tirá del agarre hacia el ombligo juntando los omóplatos, sin balancear el tronco.','Medio de la espalda y dorsales.'],
['Bíceps con mancuernas de pie',P,'Codos pegados al cuerpo. Subí girando la palma hacia arriba y bajá lento.','Frente del brazo (bíceps).'],
['Elevación de piernas','3 × 15','Acostada, subí las piernas hasta la vertical y bajá lento sin arquear la zona lumbar.','Abdomen bajo.'],
['Plancha boca abajo','3 × 40"','Apoyada en antebrazos, cuerpo en línea recta, abdomen y glúteos apretados.','Abdomen profundo.']]},
{n:'Jueves',s:'—',t:'Descanso',note:'',ex:[]},
{n:'Viernes',s:'Glúteos',t:'Piernas (glúteo/femoral) + sentadilla copa',note:'',ex:[
['Hip thrust',P,'Espalda alta apoyada en el banco. Subí la cadera hasta alinear hombros, cadera y rodillas y apretá fuerte arriba.','Glúteos.'],
['Sentadilla copa',P,'Sostené una mancuerna o disco contra el pecho. Bajá con la cadera hacia atrás, torso erguido y rodillas alineadas con los pies.','Cuádriceps y glúteos.'],
['Peso muerto con mancuerna',P,'Pies al ancho de cadera, mancuernas pegadas a las piernas. Llevá la cadera hacia atrás con rodillas apenas flexionadas y espalda recta; subí apretando glúteos.','Parte trasera del muslo (femorales) y glúteos.'],
['Estocadas',P,'Paso largo. Bajá la rodilla de atrás hacia el piso con la de adelante sobre el tobillo y subí empujando con el talón.','Glúteos y cuádriceps.'],
['Glúteo en polea',P,'Con tobillera, llevá la pierna hacia atrás sin arquear la zona lumbar y volvé controlada.','Glúteo.'],
['Abductores en poleas',P,'Abrí la pierna hacia afuera contra la resistencia, sin rebotar.','Costado del glúteo.'],
['Plancha boca abajo','3 × 40"','Apoyada en antebrazos, cuerpo en línea recta, abdomen y glúteos apretados.','Abdomen profundo.']]},
{n:'Sábado',s:'Pecho',t:'Pecho + hombros + tríceps',note:'',ex:[
['Banco plano con barra',P,'Omóplatos juntos y apoyados. Bajá al medio del pecho y empujá hacia arriba sin despegar la cadera.','Pecho (algo de tríceps y hombro).'],
['Press de hombros con mancuerna',P,'Sentada con la espalda apoyada. Subí las mancuernas sobre la cabeza sin arquear la zona lumbar.','Hombros.'],
['Francés a 2 manos',P,'Acostada, codos fijos apuntando al techo. Flexioná llevando el peso hacia la frente y extendé.','Parte trasera del brazo (tríceps).'],
['Elevación de piernas','3 × 15','Acostada, subí las piernas hasta la vertical y bajá lento sin arquear la zona lumbar.','Abdomen bajo.'],
['Plancha boca abajo','3 × 40"','Apoyada en antebrazos, cuerpo en línea recta, abdomen y glúteos apretados.','Abdomen profundo.']]},
{n:'Domingo',s:'—',t:'Descanso',note:'',ex:[]}];
let n=0;const seed=()=>SEED.map(d=>({n:d.n,s:d.s,t:d.t,note:d.note||'',ex:d.ex.map(e=>({id:'e'+(++n),n:e[0],s:e[1],h:e[2],f:e[3],v:''}))}));
const K='rutina-v1';let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.days)S={days:seed(),logs:{}};
S.days.forEach(d=>{if(d.note==null)d.note=''});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=(new Date().getDay()+6)%7;let sel=today,open=null,ed=null,ph='';
const iso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const find=id=>S.days.flatMap(d=>d.ex).find(e=>e.id==id);
function card(e){const L=S.logs[e.id]||[],l=L[0],o=open==e.id;
return `<article class="c"><div class="top" data-t="${e.id}">${e.p?`<img class="th" src="${e.p}" alt="">`:''}<div><h3>${esc(e.n)}</h3><small>${esc(e.s)}${l?' · último: '+l.w+' kg':''}</small></div><i>${o?'▲':'▼'}</i></div>`+(o?
`<div class="bd">${e.p?`<img class="ph" src="${e.p}" alt="">`:''}<p><b>Cómo se hace:</b> ${esc(e.h)}</p><p class="ft"><b>Dónde debe sentirse:</b> ${esc(e.f)}</p>
<div class="row">${e.v?`<a class="btn" href="${esc(e.v)}" target="_blank" rel="noopener">▶ Ver video</a>`:''}<button class="btn g" data-ed="${e.id}">${e.v?'✎ Editar':'✎ Editar / agregar video'}</button></div>
<div class="row"><input id="w${e.id}" type="number" inputmode="decimal" step="0.5" placeholder="Peso de hoy (kg)"><button class="btn" data-sv="${e.id}">Guardar</button></div>
<ul class="hs">${L.slice(0,10).map((x,i)=>`<li><span>${x.d.split('-').reverse().join('/')}</span><b>${x.w} kg</b><button data-dl="${e.id}|${i}">✕</button></li>`).join('')}</ul></div>`:'')+'</article>'}
function R(){const d=S.days[sel];
$('wk').innerHTML=S.days.map((x,i)=>`<button class="dy${i==sel?' on':''}${i==today?' td':''}" data-i="${i}"><b>${esc(x.n.slice(0,3))}</b><span>${esc(x.s)}</span></button>`).join('');
$('hd').innerHTML=`<h2>${esc(d.n)}</h2><p class="mut">${esc(d.t)}</p><div class="nt"><label style="margin-top:0">Tener en cuenta</label><textarea id="note" placeholder="Escribí acá algo para recordar de este día...">${esc(d.note)}</textarea></div>`;
$('note').oninput=ev=>{S.days[sel].note=ev.target.value;save()};
$('ls').innerHTML=d.ex.length?d.ex.map(card).join(''):'<p class="mut">Día de descanso 💤</p>'}
function showPh(){$('pv').hidden=$('rp').hidden=!ph;if(ph)$('pv').src=ph}
$('fp').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=480,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ph=c.toDataURL('image/jpeg',0.75);showPh()};im.src=rd.result};rd.readAsDataURL(f)};
$('rp').onclick=()=>{ph='';$('fp').value='';showPh()};
function openEd(id){ed=id;const e=id?find(id):{n:'',s:'',h:'',f:'',v:''};
$('ot').textContent=id?'Editar ejercicio':'Nuevo ejercicio';
$('fn').value=e.n;$('fs').value=e.s;$('fh').value=e.h;$('ff').value=e.f;$('fv').value=e.v;
$('rm').style.display=id?'':'none';ph=e.p||'';$('fp').value='';showPh();$('ov').hidden=false}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-i],[data-t],[data-ed],[data-sv],[data-dl]');if(!t)return;const D=t.dataset;
if(D.i!==undefined){sel=+D.i;open=null}
else if(D.t){open=open==D.t?null:D.t}
else if(D.ed){openEd(D.ed);return}
else if(D.sv){const v=parseFloat($('w'+D.sv).value.replace(',','.'));if(!(v>0))return;
const L=S.logs[D.sv]=S.logs[D.sv]||[],d=iso();if(L[0]&&L[0].d==d)L[0].w=v;else L.unshift({d,w:v});save()}
else if(D.dl){const[id,i]=D.dl.split('|');S.logs[id].splice(+i,1);save()}
R()});
$('add').onclick=()=>openEd(null);
$('no').onclick=()=>{$('ov').hidden=true};
$('ok').onclick=()=>{const n=$('fn').value.trim();if(!n)return;let v=$('fv').value.trim();if(v&&!/^https?:\/\//i.test(v))v='https://'+v;
const f={n,s:$('fs').value.trim(),h:$('fh').value.trim(),f:$('ff').value.trim(),v,p:ph};
if(ed)Object.assign(find(ed),f);else{const e={id:'n'+Date.now(),...f};S.days[sel].ex.push(e);open=e.id}
save();$('ov').hidden=true;R()};
$('rm').onclick=()=>{if(!confirm('¿Eliminar este ejercicio?'))return;S.days.forEach(d=>d.ex=d.ex.filter(e=>e.id!=ed));save();$('ov').hidden=true;open=null;R()};
R();
</script></body></html>
